name: Content safety

on:
  pull_request:
    branches: main
    paths:
      - "app/**"
      - "components/**"
      - "data/**"
      - "layouts/**"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "experiments/focused-code-prompts/**"
      - "experiments/editorial-ci/**"
      - "experiments/practical-engineering/**"
      - "experiments/agent-security/**"
      - "experiments/sql-rust/**"
      - "docs/editorial/sql-rust-*.json"
      - "docs/editorial/practical-advice-50-*.json"
      - "contentlayer.config.ts"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/**"
      - "Dockerfile"
      - "docker-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_USER: editorial
          POSTGRES_PASSWORD: disposable-fixture-only
          POSTGRES_DB: editorial
        options: >-
          --health-cmd "pg_isready -U editorial -d editorial"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - run: corepack enable && corepack prepare yarn@4.18.0 --activate
      - run: yarn install --immutable

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install isolated article fixture dependencies
        run: |
          if [ ! -f experiments/editorial-ci/package-lock.json ]; then
            npm install --package-lock-only --prefix experiments/editorial-ci --ignore-scripts --no-audit --no-fund
          fi
          npm ci --prefix experiments/editorial-ci --ignore-scripts --no-audit --no-fund
          if [ ! -f experiments/practical-engineering/package-lock.json ]; then
            npm install --package-lock-only --prefix experiments/practical-engineering --ignore-scripts --no-audit --no-fund
          fi
          npm ci --prefix experiments/practical-engineering --ignore-scripts --no-audit --no-fund
          if [ ! -f experiments/agent-security/rust/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path experiments/agent-security/rust/Cargo.toml
          fi
          npm exec --prefix experiments/editorial-ci -- playwright install --with-deps chromium

      - name: Format the article batch and preserve any required patch
        run: |
          mkdir -p /tmp/editorial-evidence
          mapfile -t article_paths < <(node --input-type=module -e 'import { editorialSeries } from "./data/editorial-series.mjs"; console.log(editorialSeries.flatMap(series => series.parts.map(slug => "data/blog/" + slug + ".mdx")).join("\n"))')
          mapfile -t sql_paths < <(node --input-type=module -e 'import { readFileSync } from "node:fs"; const series=JSON.parse(readFileSync("docs/editorial/sql-rust-proposed-series-2026-10-25.json","utf8")); console.log(series.articles.map(article => "data/blog/" + article.slug + ".mdx").join("\n"))')
          mapfile -t advice_paths < <(node --input-type=module -e 'import { readFileSync } from "node:fs"; const series=JSON.parse(readFileSync("docs/editorial/practical-advice-50-drafts-2026-10-25.json","utf8")); console.log(series.articles.map(article => article.path).join("\n"))')
          yarn prettier --write "${article_paths[@]}" "${sql_paths[@]}" "${advice_paths[@]}" \
            docs/editorial/practical-advice-50-*.json tests/practical-advice-drafts.test.mjs \
            scripts/render-practical-advice-previews.mjs scripts/verify-practical-advice-snippets.mjs \
            components/ArticleLink.tsx components/EditorialSeriesIndex.tsx components/EditorialSeriesNav.tsx \
            components/MDXComponents.tsx components/JsonLd.tsx \
            'app/(site)/blog/page.tsx' 'app/(site)/blog/[...slug]/page.tsx' 'app/(site)/blog/series/[series]/page.tsx' \
            app/sitemap.ts data/editorial-series.mjs data/editorial-series.d.mts data/writing-tiers.mjs data/rust-systems-atlas.mjs \
            lib/editorial-navigation.mjs lib/editorial-navigation.d.mts tests/editorial-navigation.test.mjs \
            docs/editorial/release-2026-10-25.json docs/editorial/sql-rust-*.json tests/sql-rust-series.test.mjs \
            tests/authority-campaign.test.mjs tests/editorial-release.test.mjs scripts/render-editorial-previews.mjs package.json \
            'experiments/editorial-ci/*.{mjs,json,md}' 'experiments/practical-engineering/*.{mjs,ts,tsx,json,md}'
          cargo fmt --manifest-path experiments/agent-security/rust/Cargo.toml
          rustfmt --edition 2021 experiments/practical-engineering/shared_counter.rs
          git add --intent-to-add experiments/editorial-ci/package-lock.json experiments/practical-engineering/package-lock.json experiments/agent-security/rust/Cargo.lock
          git diff --binary > /tmp/editorial-evidence/required-format-and-lockfiles.patch

      - name: Verify CI article examples
        run: |
          set -o pipefail
          node --test experiments/editorial-ci/*.test.mjs | tee /tmp/editorial-evidence/ci-examples.txt
          npm exec --prefix experiments/editorial-ci -- playwright test --config experiments/editorial-ci/playwright.config.mjs | tee /tmp/editorial-evidence/playwright.txt

      - name: Verify practical advice drafts and exact self-contained Rust snippets
        run: |
          set -o pipefail
          node --test tests/practical-advice-drafts.test.mjs | tee /tmp/editorial-evidence/practical-advice-content.txt
          node scripts/verify-practical-advice-snippets.mjs | tee /tmp/editorial-evidence/practical-advice-snippets.txt

      - name: Verify practical engineering examples
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -o pipefail
          node --test experiments/practical-engineering/*.test.mjs | tee /tmp/editorial-evidence/practical-examples.txt
          yarn exec tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --jsx react-jsx experiments/practical-engineering/tagging.ts experiments/practical-engineering/report-history.ts experiments/practical-engineering/ReportPicker.tsx experiments/practical-engineering/next-report-page.tsx
          node experiments/practical-engineering/check-webllm-sdk.mjs | tee /tmp/editorial-evidence/webllm-sdk.txt
          rustc --edition=2021 -O experiments/practical-engineering/shared_counter.rs -o /tmp/practical-shared-counter
          /tmp/practical-shared-counter | tee /tmp/editorial-evidence/shared-counter.txt
          docker exec -i "$POSTGRES_CONTAINER" psql --no-psqlrc --set ON_ERROR_STOP=1 -U editorial -d editorial < experiments/practical-engineering/postgres-search-trial.sql | tee /tmp/editorial-evidence/postgres-search.txt

      - name: Verify bounded agent security examples
        run: |
          set -o pipefail
          yarn exec tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler experiments/agent-security/dns_policy.ts experiments/agent-security/control_plane.ts experiments/agent-security/capability_gate.ts
          for example in host_helper process_inheritance argument_boundary job_timeout job_state; do
            python3 "experiments/agent-security/$example.py" | tee "/tmp/editorial-evidence/$example.txt"
          done
          for example in dns_policy control_plane capability_gate; do
            node "experiments/agent-security/$example.ts" | tee "/tmp/editorial-evidence/$example.txt"
          done
          cargo run --locked --manifest-path experiments/agent-security/rust/Cargo.toml --bin capability_directory | tee /tmp/editorial-evidence/capability-directory.txt
          cargo run --locked --manifest-path experiments/agent-security/rust/Cargo.toml --bin runtime_approval | tee /tmp/editorial-evidence/runtime-approval.txt

      - name: Preserve the editorial example evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: editorial-series-evidence
          path: |
            /tmp/editorial-evidence/
            experiments/editorial-ci/package-lock.json
            experiments/practical-engineering/package-lock.json
            experiments/agent-security/rust/Cargo.lock
            experiments/editorial-ci/test-results/
          if-no-files-found: warn

      - name: Typecheck the recorded prompting example
        run: yarn tsc --project experiments/focused-code-prompts/tsconfig.json

      - name: Verify recorded duplicate detection
        run: node --test experiments/focused-code-prompts/deduplicate.test.mjs

      - name: Verify the parsed and rendered preview
        run: node --test experiments/focused-code-prompts/preview.test.mjs

      - name: Render the example evidence
        if: ${{ always() }}
        run: node experiments/focused-code-prompts/write-preview.mjs

      - name: Check article and example formatting
        run: |
          format_paths=(
            data/blog/prompt-for-one-verifiable-change.mdx
            docs/editorial/prompt-for-one-verifiable-change-review.md
            tests/deployment-foundation.test.mjs
            "experiments/focused-code-prompts/session-01/candidate/**/*.ts"
            "experiments/focused-code-prompts/*.mjs"
            "experiments/focused-code-prompts/*.json"
          )
          if ! yarn prettier --check "${format_paths[@]}"; then
            yarn prettier --write "${format_paths[@]}"
            git diff --binary > /tmp/focused-code-format.patch
            exit 1
          fi

      - name: Preserve the recorded example evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: focused-code-prompt-evidence
          path: |
            experiments/focused-code-prompts/preview.html
            experiments/focused-code-prompts/session-01/*.txt
            /tmp/focused-code-format.patch
          if-no-files-found: error

      # `build` runs the campaign audit, generates content, then runs the
      # publication safety suite before Next.js builds the site.
      - run: yarn build

      - name: Render held drafts for editorial review
        run: |
          node scripts/render-editorial-previews.mjs
          node scripts/render-practical-advice-previews.mjs

      - name: Preserve rendered draft previews
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: editorial-rendered-previews
          path: /tmp/editorial-evidence/previews/
          if-no-files-found: warn

      - name: Require formatted sources and reviewed lockfiles in the commit
        run: |
          if [ -s /tmp/editorial-evidence/required-format-and-lockfiles.patch ]; then
            echo "Apply the preserved formatting and lockfile patch, then rerun verification."
            exit 1
          fi

  sql-postgres-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: editorial
          POSTGRES_PASSWORD: disposable-fixture-only
          POSTGRES_DB: editorial
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U editorial -d editorial"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CARGO_BUILD_JOBS: 2
      SQL_RUST_PG_EXPECT_VERSION_NUM: "180006"
      SQL_RUST_PG_URL: postgres://editorial:disposable-fixture-only@localhost:5432/editorial
      SQL_RUST_PG_APP_URL: postgres://editorial_app:disposable-app-only@localhost:5432/editorial
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/sql-rust/postgres-sqlite
      - name: Create the separate non-owner RLS login
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U editorial -d editorial -v ON_ERROR_STOP=1 -c "CREATE ROLE editorial_app LOGIN PASSWORD 'disposable-app-only' NOSUPERUSER NOBYPASSRLS;"
      - name: Resolve and format the PostgreSQL and SQLite examples
        run: |
          mkdir -p /tmp/sql-rust-postgres-sqlite
          cargo generate-lockfile --manifest-path experiments/sql-rust/postgres-sqlite/Cargo.toml
          cargo fmt --manifest-path experiments/sql-rust/postgres-sqlite/Cargo.toml
          git add --intent-to-add experiments/sql-rust/postgres-sqlite/Cargo.lock
          git diff --binary -- experiments/sql-rust/postgres-sqlite > /tmp/sql-rust-postgres-sqlite/required.patch
      - name: Verify the PostgreSQL and SQLite contracts
        run: |
          set -o pipefail
          cargo test --locked --all-targets --features postgres-integration --manifest-path experiments/sql-rust/postgres-sqlite/Cargo.toml 2>&1 | tee /tmp/sql-rust-postgres-sqlite/tests.txt
          for example in pg_service sqlite_local pg_snapshots pg_retry pg_hot pg_rls pg_notify pg_enum sqlite_wal sqlite_worker sqlite_foreign_keys; do
            timeout 90s cargo run --locked --features postgres-integration --manifest-path experiments/sql-rust/postgres-sqlite/Cargo.toml --bin "$example" 2>&1 | tee "/tmp/sql-rust-postgres-sqlite/$example.txt"
          done
      - name: Preserve PostgreSQL and SQLite evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sql-rust-postgres-sqlite
          path: |
            /tmp/sql-rust-postgres-sqlite/
            experiments/sql-rust/postgres-sqlite/Cargo.lock
      - name: Require committed formatting and dependency resolution
        run: test ! -s /tmp/sql-rust-postgres-sqlite/required.patch

  sql-mysql-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: disposable-root-only
          MYSQL_DATABASE: editorial
          MYSQL_USER: editorial
          MYSQL_PASSWORD: disposable-fixture-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pdisposable-root-only"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4.13
        env:
          MARIADB_ROOT_PASSWORD: disposable-root-only
          MARIADB_DATABASE: editorial
          MARIADB_USER: editorial
          MARIADB_PASSWORD: disposable-fixture-only
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      CARGO_BUILD_JOBS: 2
      SQL_RUST_DISPOSABLE: "1"
      SQL_RUST_ALLOW_PLAINTEXT_CI: "1"
      MYSQL_URL: mysql://editorial:disposable-fixture-only@localhost:3306/editorial
      MARIADB_URL: mysql://editorial:disposable-fixture-only@localhost:3307/editorial
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/sql-rust/mysql-mariadb-duckdb
      - name: Resolve and format the MySQL and MariaDB examples
        run: |
          mkdir -p /tmp/sql-rust-mysql-mariadb
          cargo generate-lockfile --manifest-path experiments/sql-rust/mysql-mariadb-duckdb/Cargo.toml
          cargo fmt --manifest-path experiments/sql-rust/mysql-mariadb-duckdb/Cargo.toml
          git add --intent-to-add experiments/sql-rust/mysql-mariadb-duckdb/Cargo.lock
          git diff --binary -- experiments/sql-rust/mysql-mariadb-duckdb > /tmp/sql-rust-mysql-mariadb/required.patch
      - name: Verify the MySQL and MariaDB contracts
        run: |
          set -o pipefail
          cargo test --locked --all-targets --no-default-features --features mysql --manifest-path experiments/sql-rust/mysql-mariadb-duckdb/Cargo.toml 2>&1 | tee /tmp/sql-rust-mysql-mariadb/tests.txt
          for example in mysql_service mariadb_contract mysql_primary_key mysql_deadlock mysql_range_lock mysql_collation mysql_mariadb_json mariadb_history; do
            timeout 90s cargo run --locked --no-default-features --features mysql --manifest-path experiments/sql-rust/mysql-mariadb-duckdb/Cargo.toml --bin "$example" 2>&1 | tee "/tmp/sql-rust-mysql-mariadb/$example.txt"
          done
      - name: Preserve MySQL and MariaDB evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sql-rust-mysql-mariadb
          path: |
            /tmp/sql-rust-mysql-mariadb/
            experiments/sql-rust/mysql-mariadb-duckdb/Cargo.lock
      - name: Require committed formatting and dependency resolution
        run: test ! -s /tmp/sql-rust-mysql-mariadb/required.patch

  sql-duckdb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/sql-rust/mysql-mariadb-duckdb
      - name: Resolve the pinned DuckDB client
        run: |
          mkdir -p /tmp/sql-rust-duckdb
          cargo generate-lockfile --manifest-path experiments/sql-rust/mysql-mariadb-duckdb/Cargo.toml
      - name: Verify embedded DuckDB contracts
        run: |
          set -o pipefail
          cargo test --locked --all-targets --no-default-features --features duckdb --manifest-path experiments/sql-rust/mysql-mariadb-duckdb/Cargo.toml 2>&1 | tee /tmp/sql-rust-duckdb/tests.txt
          for example in duckdb_report duckdb_parquet duckdb_memory; do
            timeout 90s cargo run --locked --no-default-features --features duckdb --manifest-path experiments/sql-rust/mysql-mariadb-duckdb/Cargo.toml --bin "$example" 2>&1 | tee "/tmp/sql-rust-duckdb/$example.txt"
          done
      - name: Preserve DuckDB evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sql-rust-duckdb
          path: /tmp/sql-rust-duckdb/

  sql-enterprise-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/sql-rust/sqlserver-oracle-db2
      - name: Install the ODBC driver manager for client compilation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc-dev
      - name: Resolve and format the enterprise clients
        run: |
          mkdir -p /tmp/sql-rust-enterprise
          cargo generate-lockfile --manifest-path experiments/sql-rust/sqlserver-oracle-db2/Cargo.toml
          cargo fmt --manifest-path experiments/sql-rust/sqlserver-oracle-db2/Cargo.toml
          git add --intent-to-add experiments/sql-rust/sqlserver-oracle-db2/Cargo.lock
          git diff --binary -- experiments/sql-rust/sqlserver-oracle-db2 > /tmp/sql-rust-enterprise/required.patch
      - name: Compile every enterprise database example
        run: |
          set -o pipefail
          cargo check --locked --all-targets --all-features --manifest-path experiments/sql-rust/sqlserver-oracle-db2/Cargo.toml 2>&1 | tee /tmp/sql-rust-enterprise/client-compilation.txt
      - name: Verify the independent policy tests
        run: |
          set -o pipefail
          cargo test --locked --no-default-features --manifest-path experiments/sql-rust/sqlserver-oracle-db2/Cargo.toml 2>&1 | tee /tmp/sql-rust-enterprise/policy-tests.txt
          printf '%s\n' 'SQL Server, Oracle, and Db2 server integration was not run. No configured services or native Oracle/IBM driver credentials were supplied.' > /tmp/sql-rust-enterprise/runtime-pending.txt
      - name: Preserve enterprise compilation evidence and runtime limits
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sql-rust-enterprise-clients
          path: |
            /tmp/sql-rust-enterprise/
            experiments/sql-rust/sqlserver-oracle-db2/Cargo.lock
      - name: Require committed formatting and dependency resolution
        run: test ! -s /tmp/sql-rust-enterprise/required.patch
