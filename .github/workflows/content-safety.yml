name: Content safety

on:
  pull_request:
    branches: main
    paths:
      - "app/**"
      - "components/**"
      - "data/**"
      - "layouts/**"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "contentlayer.config.ts"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/**"
      - "Dockerfile"
      - "docker-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - run: corepack enable && corepack prepare yarn@4.18.0 --activate
      - run: yarn install --immutable
      # `build` runs the campaign audit, generates content, then runs the
      # publication safety suite before Next.js builds the site.
      - run: yarn build
