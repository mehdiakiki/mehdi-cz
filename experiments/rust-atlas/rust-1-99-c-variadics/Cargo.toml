[package]
name = "c-variadics"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "varargs"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "rust-caller"
path = "src/bin/rust-caller.rs"

[[bin]]
name = "cursor"
path = "src/bin/cursor.rs"

[[bin]]
name = "misuse"
path = "src/bin/misuse.rs"
