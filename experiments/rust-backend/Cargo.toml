[package]
name = "rust-backend-labs"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
flate2 = "=1.1.5"
axum = "=0.8.9"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal", "test-util", "io-util"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tower = { version = "=0.5.2", features = ["util"] }
http-body-util = "=0.1.3"
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tracing = "=0.1.41"
tracing-subscriber = "=0.3.20"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking"] }
