[package]
name = "sql-rust-engines-b"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[features]
default = []
mysql = ["dep:sqlx", "dep:tokio"]
duckdb = ["dep:duckdb", "dep:tempfile"]

[dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls-ring-webpki"], optional = true }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }
duckdb = { version = "=1.20000.0", optional = true }
tempfile = { version = "=3.23.0", optional = true }
serde_json = "=1.0.145"

[[bin]]
name = "mysql_service"
required-features = ["mysql"]
[[bin]]
name = "mariadb_contract"
required-features = ["mysql"]
[[bin]]
name = "mysql_primary_key"
required-features = ["mysql"]
[[bin]]
name = "mysql_deadlock"
required-features = ["mysql"]
[[bin]]
name = "mysql_range_lock"
required-features = ["mysql"]
[[bin]]
name = "mysql_collation"
required-features = ["mysql"]
[[bin]]
name = "mysql_mariadb_json"
required-features = ["mysql"]
[[bin]]
name = "mariadb_history"
required-features = ["mysql"]
[[bin]]
name = "duckdb_report"
required-features = ["duckdb"]
[[bin]]
name = "duckdb_parquet"
required-features = ["duckdb"]
[[bin]]
name = "duckdb_memory"
required-features = ["duckdb"]
