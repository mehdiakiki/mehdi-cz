[package]
name = "sql-rust-postgres-sqlite"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[features]
postgres-integration = ["dep:sqlx"]

[dependencies]
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled"] }
libsqlite3-sys = { version = "=0.39.1", features = ["bundled"] }
tempfile = "=3.23.0"
tokio = { version = "=1.48.0", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
sqlx = { version = "=0.8.6", optional = true, default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }

[[bin]]
name = "pg_service"
required-features = ["postgres-integration"]
[[bin]]
name = "pg_snapshots"
required-features = ["postgres-integration"]
[[bin]]
name = "pg_retry"
required-features = ["postgres-integration"]
[[bin]]
name = "pg_hot"
required-features = ["postgres-integration"]
[[bin]]
name = "pg_rls"
required-features = ["postgres-integration"]
[[bin]]
name = "pg_notify"
required-features = ["postgres-integration"]
[[bin]]
name = "pg_enum"
required-features = ["postgres-integration"]
[[bin]]
name = "pg_waits"
required-features = ["postgres-integration"]
[[bin]]
name = "pg_commit_reply"
required-features = ["postgres-integration"]
[[bin]]
name = "pg_slow_rows"
required-features = ["postgres-integration"]
[[bin]]
name = "pg_metadata_trial"
required-features = ["postgres-integration"]
