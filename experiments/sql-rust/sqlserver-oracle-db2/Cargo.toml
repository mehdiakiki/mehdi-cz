[package]
name = "sql-rust-enterprise-examples"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
sqlserver = ["dep:tiberius", "dep:tokio", "dep:tokio-util"]
oracle-native = ["dep:oracle"]
db2-odbc = ["dep:odbc-api"]

[dependencies]
tiberius = { version = "=0.13.0", optional = true, default-features = false, features = ["rustls", "tds73"] }
tokio = { version = "=1.54.1", optional = true, features = ["rt", "macros", "net", "time"] }
tokio-util = { version = "=0.7.20", optional = true, features = ["compat"] }
oracle = { version = "=0.6.3", optional = true }
odbc-api = { version = "=29.2.0", optional = true }

[[bin]]
name = "sqlserver_profile"
required-features = ["sqlserver"]
[[bin]]
name = "sqlserver_blocking"
required-features = ["sqlserver"]
[[bin]]
name = "sqlserver_plans"
required-features = ["sqlserver"]
[[bin]]
name = "sqlserver_bulk"
required-features = ["sqlserver"]
[[bin]]
name = "oracle_profile"
required-features = ["oracle-native"]
[[bin]]
name = "oracle_empty"
required-features = ["oracle-native"]
[[bin]]
name = "oracle_number"
required-features = ["oracle-native"]
[[bin]]
name = "db2_profile"
required-features = ["db2-odbc"]
